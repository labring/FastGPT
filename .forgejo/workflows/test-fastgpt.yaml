name: 'Test FastGPT'
on:
  pull_request:
    paths:
      - 'packages/dal/**'
      - 'packages/global/**'
      - 'packages/service/**'
      - 'packages/web/**'
      - 'packages/workflow-core/**'
      - 'cli/**'
      - 'projects/app/**'
      - 'sdk/**'
      - 'test/**'
      - 'scripts/test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'eslint.config.mjs'
      - '.npmrc'
      - '.github/workflows/test-fastgpt.yaml'
      - '.forgejo/workflows/test-fastgpt.yaml'
  workflow_dispatch:

    # Only one build per PR branch at a time
concurrency:
  group: 'test-fastgpt-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  # Required to checkout the code
  contents: read

jobs:
  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Global'
        env:
          FASTGPT_TEST_SCOPE: global
        run: pnpm test

      - name: 'Upload Coverage (Global)'
        if: always() && hashFiles('packages/global/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-global
          path: |
            packages/global/coverage/coverage-final.json
            packages/global/coverage/coverage-summary.json

  test-dal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Capture proxy envs from variables
        run: |
          echo "HTTP_PROXY=${{ vars.AB_HTTP_PROXY }}" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=${{ vars.AB_HTTPS_PROXY }}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${{ vars.AB_NO_PROXY }}" >> "$GITHUB_ENV"
          echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Pre-download MongoDB binary
        run: |
          MONGODB_VERSION="8.2.6"
          UBUNTU_TAG="ubuntu2204"
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            case "${VERSION_ID%%.*}" in
              24|26|28) UBUNTU_TAG="ubuntu2404" ;;
            esac
          fi
          ARCHIVE="mongodb-linux-x86_64-${UBUNTU_TAG}-${MONGODB_VERSION}"
          CACHE_DIR="$HOME/.cache/mongodb-binaries/${ARCHIVE}"
          if [ ! -f "${CACHE_DIR}/mongod" ]; then
            mkdir -p "${CACHE_DIR}"
            TMP_DIR="$(mktemp -d)"
            echo "Downloading MongoDB ${MONGODB_VERSION} (${UBUNTU_TAG}) via proxy..."
            curl --proxy "${{ vars.AB_HTTP_PROXY }}" -fsSL \
              "https://fastdl.mongodb.org/linux/${ARCHIVE}.tgz" \
              | tar xz -C "${TMP_DIR}"
            cp "${TMP_DIR}/${ARCHIVE}/bin/mongod" "${CACHE_DIR}/mongod.$$.tmp"
            chmod +x "${CACHE_DIR}/mongod.$$.tmp"
            mv -f "${CACHE_DIR}/mongod.$$.tmp" "${CACHE_DIR}/mongod"
            rm -rf "${TMP_DIR}"
            echo "MongoDB binary cached at ${CACHE_DIR}/mongod"
          else
            echo "MongoDB binary already cached at ${CACHE_DIR}/mongod"
          fi
          chmod +x "${CACHE_DIR}/mongod"
          echo "MONGOMS_SYSTEM_BINARY=${CACHE_DIR}/mongod" >> "$GITHUB_ENV"

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck DAL'
        run: pnpm --filter @fastgpt/dal typecheck

      - name: 'Test DAL'
        env:
          FASTGPT_TEST_SCOPE: dal
          FASTGPT_TEST_OCEANBASE_URI: ${{ vars.AB_TEST_OCEANBASE_URI }}
        run: |
          if [ -n "$(printf '%s' "${FASTGPT_TEST_OCEANBASE_URI}" | tr -d '[:space:]')" ]; then
            export FASTGPT_TEST_REQUIRED_OCEANBASE=1
          fi
          pnpm test

      - name: 'Upload Coverage (DAL)'
        if: always() && hashFiles('packages/dal/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-dal
          path: |
            packages/dal/coverage/coverage-final.json
            packages/dal/coverage/coverage-summary.json

  test-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Capture proxy envs from variables
        run: |
          echo "HTTP_PROXY=${{ vars.AB_HTTP_PROXY }}" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=${{ vars.AB_HTTPS_PROXY }}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${{ vars.AB_NO_PROXY }}" >> "$GITHUB_ENV"
          echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Pre-download MongoDB binary
        run: |
          MONGODB_VERSION="8.2.6"
          UBUNTU_TAG="ubuntu2204"
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            case "${VERSION_ID%%.*}" in
              24|26|28) UBUNTU_TAG="ubuntu2404" ;;
            esac
          fi
          ARCHIVE="mongodb-linux-x86_64-${UBUNTU_TAG}-${MONGODB_VERSION}"
          CACHE_DIR="$HOME/.cache/mongodb-binaries/${ARCHIVE}"
          if [ ! -f "${CACHE_DIR}/mongod" ]; then
            mkdir -p "${CACHE_DIR}"
            TMP_DIR="$(mktemp -d)"
            echo "Downloading MongoDB ${MONGODB_VERSION} (${UBUNTU_TAG}) via proxy..."
            curl --proxy "${{ vars.AB_HTTP_PROXY }}" -fsSL \
              "https://fastdl.mongodb.org/linux/${ARCHIVE}.tgz" \
              | tar xz -C "${TMP_DIR}"
            cp "${TMP_DIR}/${ARCHIVE}/bin/mongod" "${CACHE_DIR}/mongod.$$.tmp"
            chmod +x "${CACHE_DIR}/mongod.$$.tmp"
            mv -f "${CACHE_DIR}/mongod.$$.tmp" "${CACHE_DIR}/mongod"
            rm -rf "${TMP_DIR}"
            echo "MongoDB binary cached at ${CACHE_DIR}/mongod"
          else
            echo "MongoDB binary already cached at ${CACHE_DIR}/mongod"
          fi
          chmod +x "${CACHE_DIR}/mongod"
          echo "MONGOMS_SYSTEM_BINARY=${CACHE_DIR}/mongod" >> "$GITHUB_ENV"

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Service'
        env:
          FASTGPT_TEST_SCOPE: service
        run: pnpm test

      - name: 'Upload Coverage (Service)'
        if: always() && hashFiles('packages/service/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-service
          path: |
            packages/service/coverage/coverage-final.json
            packages/service/coverage/coverage-summary.json

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Capture proxy envs from variables
        run: |
          echo "HTTP_PROXY=${{ vars.AB_HTTP_PROXY }}" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=${{ vars.AB_HTTPS_PROXY }}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${{ vars.AB_NO_PROXY }}" >> "$GITHUB_ENV"
          echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Pre-download MongoDB binary
        run: |
          MONGODB_VERSION="8.2.6"
          UBUNTU_TAG="ubuntu2204"
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            case "${VERSION_ID%%.*}" in
              24|26|28) UBUNTU_TAG="ubuntu2404" ;;
            esac
          fi
          ARCHIVE="mongodb-linux-x86_64-${UBUNTU_TAG}-${MONGODB_VERSION}"
          CACHE_DIR="$HOME/.cache/mongodb-binaries/${ARCHIVE}"
          if [ ! -f "${CACHE_DIR}/mongod" ]; then
            mkdir -p "${CACHE_DIR}"
            TMP_DIR="$(mktemp -d)"
            echo "Downloading MongoDB ${MONGODB_VERSION} (${UBUNTU_TAG}) via proxy..."
            curl --proxy "${{ vars.AB_HTTP_PROXY }}" -fsSL \
              "https://fastdl.mongodb.org/linux/${ARCHIVE}.tgz" \
              | tar xz -C "${TMP_DIR}"
            cp "${TMP_DIR}/${ARCHIVE}/bin/mongod" "${CACHE_DIR}/mongod.$$.tmp"
            chmod +x "${CACHE_DIR}/mongod.$$.tmp"
            mv -f "${CACHE_DIR}/mongod.$$.tmp" "${CACHE_DIR}/mongod"
            rm -rf "${TMP_DIR}"
            echo "MongoDB binary cached at ${CACHE_DIR}/mongod"
          else
            echo "MongoDB binary already cached at ${CACHE_DIR}/mongod"
          fi
          chmod +x "${CACHE_DIR}/mongod"
          echo "MONGOMS_SYSTEM_BINARY=${CACHE_DIR}/mongod" >> "$GITHUB_ENV"

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test App'
        env:
          FASTGPT_TEST_SCOPE: app
        run: pnpm test

      - name: 'Upload Coverage (App)'
        if: always() && hashFiles('projects/app/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-app
          path: |
            projects/app/coverage/coverage-final.json
            projects/app/coverage/coverage-summary.json

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Web'
        env:
          FASTGPT_TEST_SCOPE: web
        run: pnpm test

      - name: 'Upload Coverage (Web)'
        if: always() && hashFiles('packages/web/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-web
          path: |
            packages/web/coverage/coverage-final.json
            packages/web/coverage/coverage-summary.json

  test-workflow-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck Workflow Core'
        run: pnpm --filter @fastgpt/workflow-core typecheck

      - name: 'Test Workflow Core'
        env:
          FASTGPT_TEST_SCOPE: workflow-core
        run: pnpm test

      - name: 'Build Workflow Core'
        run: pnpm --filter @fastgpt/workflow-core build

      - name: 'Upload Coverage (Workflow Core)'
        if: always() && hashFiles('packages/workflow-core/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-workflow-core
          path: packages/workflow-core/coverage/coverage-summary.json

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck CLI'
        run: pnpm --filter @fastgpt/cli typecheck

      - name: 'Lint CLI'
        run: pnpm --filter @fastgpt/cli lint

      - name: 'Test CLI'
        env:
          FASTGPT_TEST_SCOPE: cli
        run: pnpm test

      - name: 'Verify CLI bin smoke'
        run: pnpm --filter @fastgpt/cli test:bin

      - name: 'Upload Coverage (CLI)'
        if: always() && hashFiles('cli/coverage/coverage-summary.json') != ''
        uses: forgejo/upload-artifact@v4
        with:
          name: coverage-cli
          path: cli/coverage/coverage-summary.json

  report-coverage:
    runs-on: ubuntu-latest
    needs: [test-global, test-dal, test-service, test-web, test-app, test-workflow-core, test-cli]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: 'Download Coverage Artifacts'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-global
          path: coverage-artifacts/coverage-global
        continue-on-error: true

      - name: 'Download Coverage (DAL)'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-dal
          path: coverage-artifacts/coverage-dal
        continue-on-error: true

      - name: 'Download Coverage Artifacts'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-service
          path: coverage-artifacts/coverage-service
        continue-on-error: true

      - name: 'Download Coverage Artifacts'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-web
          path: coverage-artifacts/coverage-web
        continue-on-error: true

      - name: 'Download Coverage Artifacts'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-app
          path: coverage-artifacts/coverage-app
        continue-on-error: true

      - name: 'Download Coverage (Workflow Core)'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-workflow-core
          path: coverage-artifacts/coverage-workflow-core
        continue-on-error: true

      - name: 'Download Coverage (CLI)'
        uses: forgejo/download-artifact@v4
        with:
          name: coverage-cli
          path: coverage-artifacts/coverage-cli
        continue-on-error: true

      - name: 'Generate Coverage Summary'
        if: github.event_name == 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const marker = '<!-- fastgpt-coverage-report -->';
          const packages = [
            { name: 'Global', dir: 'coverage-global' },
            { name: 'DAL', dir: 'coverage-dal' },
            { name: 'Service', dir: 'coverage-service' },
            { name: 'Web', dir: 'coverage-web' },
            { name: 'App', dir: 'coverage-app' },
            { name: 'Workflow Core', dir: 'coverage-workflow-core' },
            { name: 'CLI', dir: 'coverage-cli' }
          ];
          const formatPct = (value) => {
            if (typeof value !== 'number') return 'N/A';
            return value.toFixed(2) + '%';
          };
          const rows = packages.map((pkg) => {
            const summaryPath = path.join(process.cwd(), 'coverage-artifacts', pkg.dir, 'coverage-summary.json');
            if (!fs.existsSync(summaryPath)) {
              return '| ' + pkg.name + ' | N/A | N/A | N/A | N/A |';
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const total = summary.total || {};
            return '| ' + pkg.name + ' | ' +
              formatPct(total.statements?.pct) + ' | ' +
              formatPct(total.branches?.pct) + ' | ' +
              formatPct(total.functions?.pct) + ' | ' +
              formatPct(total.lines?.pct) + ' |';
          });
          const body = [
            marker,
            '## Coverage Report',
            '',
            '| Package | Statements | Branches | Functions | Lines |',
            '| --- | ---: | ---: | ---: | ---: |',
            ...rows
          ].join('\n');
          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, body, { flag: 'a' });
          "

      - name: 'Check Test Results'
        run: |
          if { [ "${{ needs.test-global.result }}" != "success" ] &&
               [ "${{ needs.test-global.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-dal.result }}" != "success" ] &&
               [ "${{ needs.test-dal.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-service.result }}" != "success" ] &&
               [ "${{ needs.test-service.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-web.result }}" != "success" ] &&
               [ "${{ needs.test-web.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-workflow-core.result }}" != "success" ] &&
               [ "${{ needs.test-workflow-core.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-cli.result }}" != "success" ] &&
               [ "${{ needs.test-cli.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-app.result }}" != "success" ] &&
               [ "${{ needs.test-app.result }}" != "skipped" ]; }; then
            exit 1
          fi
