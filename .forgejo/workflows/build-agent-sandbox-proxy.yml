name: Release Agent-sandbox-proxy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'fastgpt-agent-sandbox-proxy image tag'
        required: false
        default: latest
        type: string

permissions: {}

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate image tag
        id: validate
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          TAG="${RAW_TAG:-latest}"
          if [[ "$TAG" == *$'\n'* || "$TAG" == *$'\r'* || ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid OCI image tag. Expected pattern ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$."
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  build-fastgpt-agent-sandbox-proxy-images:
    needs: validate-tag
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture proxy envs from variables
        run: |
          echo "HTTP_PROXY=${{ vars.AB_HTTP_PROXY }}" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=${{ vars.AB_HTTPS_PROXY }}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${{ vars.AB_NO_PROXY }}" >> "$GITHUB_ENV"
          echo "APT_MIRROR_UBUNTU=${{ vars.AB_APT_MIRROR_UBUNTU }}" >> "$GITHUB_ENV"
          echo "APT_MIRROR_DEBIAN=${{ vars.AB_APT_MIRROR_DEBIAN }}" >> "$GITHUB_ENV"
          echo "APT_MIRROR_DEBIAN_SECURITY=${{ vars.AB_APT_MIRROR_DEBIAN_SECURITY }}" >> "$GITHUB_ENV"
          echo "NPM_REGISTRY=${{ vars.AB_NPM_REGISTRY }}" >> "$GITHUB_ENV"

      - name: Write buildkitd config
        run: |
          REGISTRY_HOST="${{ github.server_url }}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          echo "REGISTRY_HOST=${REGISTRY_HOST}" >> "$GITHUB_ENV"
          mkdir -p /tmp/buildkit
          cat > /tmp/buildkit/buildkitd.toml << EOF
          [registry."docker.io"]
            mirrors = ["mirrors.sangfor.com"]
          [registry."${REGISTRY_HOST}"]
            http = true
            insecure = true
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.GODEBUG=madvdontneed=0
            env.HTTP_PROXY=${{ env.HTTP_PROXY }}
            env.HTTPS_PROXY=${{ env.HTTPS_PROXY }}
            env.NO_PROXY=${{ env.REGISTRY_HOST }}
          buildkitd-config: /tmp/buildkit/buildkitd.toml

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-fastgpt-agent-sandbox-proxy-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fastgpt-agent-sandbox-proxy-buildx-

      - name: Set platform variables
        run: |
          REGISTRY="${{ github.server_url }}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build for ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        env:
          GODEBUG: madvdontneed=0
        with:
          context: projects/agent-sandbox-proxy
          file: projects/agent-sandbox-proxy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            HTTP_PROXY=${{ env.HTTP_PROXY }}
            HTTPS_PROXY=${{ env.HTTPS_PROXY }}
            NO_PROXY=${{ env.NO_PROXY }}
            APT_MIRROR_UBUNTU=${{ env.APT_MIRROR_UBUNTU }}
            APT_MIRROR_DEBIAN=${{ env.APT_MIRROR_DEBIAN }}
            APT_MIRROR_DEBIAN_SECURITY=${{ env.APT_MIRROR_DEBIAN_SECURITY }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.description=fastgpt-agent-sandbox-proxy image
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ github.repository_owner }}/fastgpt-agent-sandbox-proxy",push-by-digest=true,push=true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Export digest
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP_DIR}/digests"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest: ${DIGEST}"
            exit 1
          fi
          touch "${RUNNER_TEMP_DIR}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: forgejo/upload-artifact@v4
        with:
          name: digests-fastgpt-agent-sandbox-proxy-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release-fastgpt-agent-sandbox-proxy-images:
    permissions:
      packages: write
      contents: read
    needs: [validate-tag, build-fastgpt-agent-sandbox-proxy-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Set platform variables
        run: |
          REGISTRY="${{ github.server_url }}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Capture proxy envs from variables
        run: |
          echo "HTTP_PROXY=${{ vars.AB_HTTP_PROXY }}" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=${{ vars.AB_HTTPS_PROXY }}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${{ vars.AB_NO_PROXY }}" >> "$GITHUB_ENV"
          echo "APT_MIRROR_UBUNTU=${{ vars.AB_APT_MIRROR_UBUNTU }}" >> "$GITHUB_ENV"
          echo "APT_MIRROR_DEBIAN=${{ vars.AB_APT_MIRROR_DEBIAN }}" >> "$GITHUB_ENV"
          echo "APT_MIRROR_DEBIAN_SECURITY=${{ vars.AB_APT_MIRROR_DEBIAN_SECURITY }}" >> "$GITHUB_ENV"
          echo "NPM_REGISTRY=${{ vars.AB_NPM_REGISTRY }}" >> "$GITHUB_ENV"

      - name: Write buildkitd config
        run: |
          REGISTRY_HOST="${{ github.server_url }}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          echo "REGISTRY_HOST=${REGISTRY_HOST}" >> "$GITHUB_ENV"
          mkdir -p /tmp/buildkit
          cat > /tmp/buildkit/buildkitd.toml << EOF
          [registry."docker.io"]
            mirrors = ["mirrors.sangfor.com"]
          [registry."${REGISTRY_HOST}"]
            http = true
            insecure = true
          EOF

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Download digests
        uses: forgejo/download-artifact@v4
        with:
          name: digests-fastgpt-agent-sandbox-proxy-${{ github.sha }}-amd64
          path: ${{ runner.temp }}/digests

      - name: Download digests
        uses: forgejo/download-artifact@v4
        with:
          name: digests-fastgpt-agent-sandbox-proxy-${{ github.sha }}-arm64
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.GODEBUG=madvdontneed=0
            env.HTTP_PROXY=${{ env.HTTP_PROXY }}
            env.HTTPS_PROXY=${{ env.HTTPS_PROXY }}
            env.NO_PROXY=${{ env.REGISTRY_HOST }}
          buildkitd-config: /tmp/buildkit/buildkitd.toml

      - name: Set image name and tag
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          printf 'Git_Tag=%s/%s/fastgpt-agent-sandbox-proxy:%s\n' "${REGISTRY}" "${REPO_OWNER}" "${TAG}" >> "$GITHUB_ENV"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${REPO_OWNER}/fastgpt-agent-sandbox-proxy"
          SOURCES=()
          for digest_file in ./*; do
            [[ -f "$digest_file" ]] || continue
            SOURCES+=("${IMAGE_REF}@sha256:$(basename "$digest_file")")
          done
          if [[ "${#SOURCES[@]}" -ne 2 ]]; then
            echo "Expected two digests"
            exit 1
          fi
          docker buildx imagetools create -t "${Git_Tag}" "${SOURCES[@]}"
          sleep 5
