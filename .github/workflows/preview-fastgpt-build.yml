name: Preview FastGPT Image — Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['*']

# Only one build per PR branch at a time.
concurrency:
  group: 'preview-fastgpt-build-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect_changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_build: ${{ steps.preview_matrix.outputs.should_build }}
      should_typecheck_app: ${{ steps.preview_matrix.outputs.should_typecheck_app }}
      matrix: ${{ steps.preview_matrix.outputs.matrix }}

    steps:
      - name: Build preview image matrix
        id: preview_matrix
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100
            });
            const fileNames = changedFiles.map((file) => file.filename);
            const hasPath = (paths) => fileNames.some((fileName) =>
              paths.some((path) => fileName === path || fileName.startsWith(`${path}/`))
            );

            const images = [];
            const addImage = (image) => images.push(image);

            if (hasPath([
              'projects/app',
              'packages',
              'sdk',
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'tsconfig.json',
              '.npmrc',
              'turbo.json'
            ])) {
              addImage({
                image: 'fastgpt',
                image_name: 'fastgpt',
                dockerfile: 'projects/app/Dockerfile',
                description: 'fastgpt-pr image'
              });
            }

            if (hasPath(['projects/code-sandbox'])) {
              addImage({
                image: 'code-sandbox',
                image_name: 'fastgpt-code-sandbox',
                dockerfile: 'projects/code-sandbox/Dockerfile',
                description: 'fastgpt-code-sandbox-pr image'
              });
            }

            if (hasPath(['projects/mcp_server'])) {
              addImage({
                image: 'mcp_server',
                image_name: 'fastgpt-mcp-server',
                dockerfile: 'projects/mcp_server/Dockerfile',
                description: 'fastgpt-mcp_server-pr image'
              });
            }

            const matrix = images.length > 0
              ? { include: images }
              : { include: [{ image: 'noop', image_name: 'noop', dockerfile: 'noop', description: 'noop' }] };

            core.info(`Preview images selected: ${images.map((image) => image.image).join(', ') || 'none'}`);
            core.setOutput('should_build', images.length > 0 ? 'true' : 'false');
            core.setOutput(
              'should_typecheck_app',
              images.some((image) => image.image === 'fastgpt') ? 'true' : 'false'
            );
            core.setOutput('matrix', JSON.stringify(matrix));

  typecheck-app:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.should_typecheck_app == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            packages/global/.tsc-out
            packages/dal/.tsc-out
            packages/web/.tsc-out
            packages/service/.tsc-out
            projects/app/.tsc-out
          key: tsc-app-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'packages/*/tsconfig*.json', 'projects/app/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-app-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'packages/*/tsconfig*.json', 'projects/app/tsconfig*.json') }}-
            tsc-app-${{ runner.os }}-

      - name: Build workspace SDKs and workflow-core
        run: |
          pnpm build:sdks
          pnpm --filter @fastgpt/workflow-core build

      - name: Typecheck app
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'
        run: pnpm --filter @fastgpt/app typecheck

  build:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.detect_changes.outputs.matrix) }}
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            ${{ matrix.image == 'fastgpt' && 'SKIP_TYPE_CHECK=true' || '' }}
          tags: ${{ matrix.image_name }}-pr:${{ github.event.pull_request.head.sha }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/FastGPT
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          outputs: type=docker,dest=/tmp/${{ matrix.image_name }}-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.image }}-image
          path: /tmp/${{ matrix.image_name }}-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
