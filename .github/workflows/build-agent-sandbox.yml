name: Release Agent-sandbox
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release version
        id: version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Image version must start with v. Current value: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── agent-sandbox ──────────────────────────────────────────────────────────
  build-fastgpt-agent-sandbox-images:
    needs: validate-version
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
            variant: nonroot
            target: nonroot
            image-name: fastgpt-agent-sandbox
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            variant: nonroot
            target: nonroot
            image-name: fastgpt-agent-sandbox
          - arch: amd64
            runs-on: ubuntu-24.04
            variant: root
            target: root
            image-name: fastgpt-agent-sandbox-root
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            variant: root
            target: root
            image-name: fastgpt-agent-sandbox-root
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-agent-sandbox-${{ matrix.variant }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-agent-sandbox-${{ matrix.variant }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Ali Hub
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.FASTGPT_ALI_IMAGE_USER }}
          password: ${{ secrets.FASTGPT_ALI_IMAGE_PSW }}

      - name: Build ${{ matrix.image-name }} for ${{ matrix.arch }}
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/agent-sandbox/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.image-name }} image
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image-name }}",push-by-digest=true,push=true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Build for Ali Hub ${{ matrix.arch }}
        id: build-aliyun
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/agent-sandbox/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.image-name }} image
          provenance: false
          sbom: false
          outputs: type=image,"name=${{ secrets.FASTGPT_ALI_IMAGE_PREFIX }}/${{ matrix.image-name }}",push-by-digest=true,push=true
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/ghcr
          mkdir -p ${{ runner.temp }}/digests/aliyun
          ghcr_digest="${{ steps.build-ghcr.outputs.digest }}"
          aliyun_digest="${{ steps.build-aliyun.outputs.digest }}"
          touch "${{ runner.temp }}/digests/ghcr/${ghcr_digest#sha256:}"
          touch "${{ runner.temp }}/digests/aliyun/${aliyun_digest#sha256:}"

      - name: Upload GHCR digest
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-digests-fastgpt-agent-sandbox-${{ matrix.variant }}-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/ghcr/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Ali Hub digest
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-digests-fastgpt-agent-sandbox-${{ matrix.variant }}-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/aliyun/*
          if-no-files-found: error
          retention-days: 1

  release-fastgpt-agent-sandbox-images:
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    needs: [validate-version, build-fastgpt-agent-sandbox-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - variant: nonroot
            image-name: fastgpt-agent-sandbox
          - variant: root
            image-name: fastgpt-agent-sandbox-root
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Ali Hub
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.FASTGPT_ALI_IMAGE_USER }}
          password: ${{ secrets.FASTGPT_ALI_IMAGE_PSW }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_NAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: ghcr-digests-fastgpt-agent-sandbox-${{ matrix.variant }}-${{ github.sha }}-*
          merge-multiple: true

      - name: Download Ali Hub digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/aliyun
          pattern: aliyun-digests-fastgpt-agent-sandbox-${{ matrix.variant }}-${{ github.sha }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name and tag
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          IMAGE_NAME="${{ matrix.image-name }}"
          echo "Git_Tag=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${VERSION}" >> $GITHUB_ENV
          echo "Git_Latest=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest" >> $GITHUB_ENV
          echo "Ali_Tag=${{ secrets.FASTGPT_ALI_IMAGE_PREFIX }}/${IMAGE_NAME}:${VERSION}" >> $GITHUB_ENV
          echo "Ali_Latest=${{ secrets.FASTGPT_ALI_IMAGE_PREFIX }}/${IMAGE_NAME}:latest" >> $GITHUB_ENV
          echo "Docker_Hub_Tag=${{ secrets.DOCKER_IMAGE_NAME }}/${IMAGE_NAME}:${VERSION}" >> $GITHUB_ENV
          echo "Docker_Hub_Latest=${{ secrets.DOCKER_IMAGE_NAME }}/${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image-name }}"
          ALI_IMAGE="${{ secrets.FASTGPT_ALI_IMAGE_PREFIX }}/${{ matrix.image-name }}"
          GHCR_SOURCES=()
          for digest_file in ./*; do
            [[ -f "$digest_file" ]] || continue
            GHCR_SOURCES+=("${GHCR_IMAGE}@sha256:$(basename "$digest_file")")
          done
          ALI_SOURCES=()
          for digest_file in aliyun/*; do
            [[ -f "$digest_file" ]] || continue
            ALI_SOURCES+=("${ALI_IMAGE}@sha256:$(basename "$digest_file")")
          done
          if [[ "${#GHCR_SOURCES[@]}" -ne 2 || "${#ALI_SOURCES[@]}" -ne 2 ]]; then
            echo "Expected two GHCR and two Ali Hub digests"
            exit 1
          fi

          retry_imagetools_create() {
            local tag="$1"
            shift

            for attempt in 1 2 3 4; do
              if docker buildx imagetools create -t "$tag" "$@"; then
                return 0
              fi

              if [ "$attempt" -eq 4 ]; then
                echo "::error::Failed to push manifest ${tag} after 3 retries."
                return 1
              fi

              echo "::warning::Failed to push manifest ${tag}; retrying in $((attempt * 15)) seconds (${attempt}/3)."
              sleep $((attempt * 15))
            done
          }

          for TAG in "${Git_Tag}" "${Git_Latest}" "${Docker_Hub_Tag}" "${Docker_Hub_Latest}"; do
            retry_imagetools_create "$TAG" "${GHCR_SOURCES[@]}"
            sleep 5
          done
          for TAG in "${Ali_Tag}" "${Ali_Latest}"; do
            retry_imagetools_create "$TAG" "${ALI_SOURCES[@]}"
            sleep 5
          done

          manifest="$(docker buildx imagetools inspect --raw "${Ali_Tag}")"
          jq -e '
            ([.manifests[]?.platform | select(.os == "linux" and .architecture == "amd64")] | length == 1) and
            ([.manifests[]?.platform | select(.os == "linux" and .architecture == "arm64")] | length == 1) and
            ([.manifests[]?.platform | select(.os == "linux" and (.architecture != "amd64" and .architecture != "arm64"))] | length == 0)
          ' <<<"$manifest" >/dev/null

  # ── volume-manager ─────────────────────────────────────────────────────────
