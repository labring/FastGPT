name: 'Test FastGPT'
on:
  pull_request:
    paths:
      - 'packages/dal/**'
      - 'packages/global/**'
      - 'packages/service/**'
      - 'packages/web/**'
      - 'packages/workflow-core/**'
      - 'cli/**'
      - 'projects/app/**'
      - 'sdk/**'
      - 'test/**'
      - 'scripts/test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'eslint.config.mjs'
      - '.npmrc'
      - '.github/workflows/test-fastgpt.yaml'
  workflow_dispatch:

    # Only one build per PR branch at a time
concurrency:
  group: 'test-fastgpt-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  # Required to checkout the code
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_global: ${{ steps.scope.outputs.run_global }}
      run_dal: ${{ steps.scope.outputs.run_dal }}
      run_service: ${{ steps.scope.outputs.run_service }}
      run_web: ${{ steps.scope.outputs.run_web }}
      run_app: ${{ steps.scope.outputs.run_app }}
      run_workflow_core: ${{ steps.scope.outputs.run_workflow_core }}
      run_cli: ${{ steps.scope.outputs.run_cli }}
      should_report: ${{ steps.scope.outputs.should_report }}

    steps:
      - name: Detect affected test scopes
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const setOutputs = ({ global, dal, service, web, app, workflowCore, cli }) => {
              const shouldReport = global || dal || service || web || app || workflowCore || cli;
              core.setOutput('run_global', global ? 'true' : 'false');
              core.setOutput('run_dal', dal ? 'true' : 'false');
              core.setOutput('run_service', service ? 'true' : 'false');
              core.setOutput('run_web', web ? 'true' : 'false');
              core.setOutput('run_app', app ? 'true' : 'false');
              core.setOutput('run_workflow_core', workflowCore ? 'true' : 'false');
              core.setOutput('run_cli', cli ? 'true' : 'false');
              core.setOutput('should_report', shouldReport ? 'true' : 'false');
              core.info(
                `Test scopes selected: global=${global}, dal=${dal}, service=${service}, web=${web}, app=${app}, workflowCore=${workflowCore}, cli=${cli}`
              );
            };

            if (context.eventName !== 'pull_request') {
              setOutputs({ global: true, dal: true, service: true, web: true, app: true, workflowCore: true, cli: true });
              return;
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const fileNames = changedFiles.map((file) => file.filename);
            const hasPath = (paths) => fileNames.some((fileName) =>
              paths.some((path) => fileName === path || fileName.startsWith(`${path}/`))
            );

            const affectsAll = hasPath([
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'turbo.json',
              'tsconfig.json',
              'vitest.config.mts',
              'eslint.config.mjs',
              '.npmrc',
              'test',
              'scripts/test',
              '.github/workflows/test-fastgpt.yaml'
            ]);

            const runGlobal = affectsAll || hasPath(['packages/global']);
            const runDal = affectsAll || hasPath(['packages/global', 'packages/dal', 'sdk']);
            const runService = affectsAll || hasPath(['packages/global', 'packages/dal', 'packages/service', 'sdk']);
            const runWeb = affectsAll || hasPath(['packages/global', 'packages/web']);
            const runApp = affectsAll || hasPath([
              'packages/global',
              'packages/dal',
              'packages/service',
              'packages/web',
              'packages/workflow-core',
              'projects/app',
              'sdk'
            ]);

            const runWorkflowCore = affectsAll || hasPath(['packages/global', 'packages/workflow-core']);
            const runCli = affectsAll || hasPath([
              'packages/global',
              'packages/workflow-core',
              'cli'
            ]);

            setOutputs({
              global: runGlobal,
              dal: runDal,
              service: runService,
              web: runWeb,
              app: runApp,
              workflowCore: runWorkflowCore,
              cli: runCli
            });

  test-global:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_global == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Global'
        env:
          FASTGPT_TEST_SCOPE: global
        run: pnpm test

      - name: 'Upload Coverage (Global)'
        if: always() && hashFiles('packages/global/coverage/coverage-summary.json') !=
          ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-global
          path: |
            packages/global/coverage/coverage-final.json
            packages/global/coverage/coverage-summary.json

  test-dal:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_dal == 'true' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fastgpt_test_root
          MYSQL_DATABASE: fastgpt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfastgpt_test_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck DAL'
        run: pnpm --filter @fastgpt/dal typecheck

      - name: 'Test DAL (Mongo + PGlite + MySQL 8 + Anti-Drift)'
        env:
          FASTGPT_TEST_SCOPE: dal
          FASTGPT_TEST_MYSQL_URI: mysql://root:fastgpt_test_root@127.0.0.1:3306/fastgpt_test
        run: pnpm test

      - name: 'Upload Coverage (DAL)'
        if: always() && hashFiles('packages/dal/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dal
          path: |
            packages/dal/coverage/coverage-final.json
            packages/dal/coverage/coverage-summary.json

  test-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Service'
        env:
          FASTGPT_TEST_SCOPE: service
        run: pnpm test

      - name: 'Upload Coverage (Service)'
        if: always() && hashFiles('packages/service/coverage/coverage-summary.json') !=
          ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-service
          path: |
            packages/service/coverage/coverage-final.json
            packages/service/coverage/coverage-summary.json

  test-app:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test App'
        env:
          FASTGPT_TEST_SCOPE: app
        run: pnpm test

      - name: 'Upload Coverage (App)'
        if: always() && hashFiles('projects/app/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-app
          path: |
            projects/app/coverage/coverage-final.json
            projects/app/coverage/coverage-summary.json

  test-web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Web'
        env:
          FASTGPT_TEST_SCOPE: web
        run: pnpm test

      - name: 'Upload Coverage (Web)'
        if: always() && hashFiles('packages/web/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: |
            packages/web/coverage/coverage-final.json
            packages/web/coverage/coverage-summary.json

  test-workflow-core:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_workflow_core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck Workflow Core'
        run: pnpm --filter @fastgpt/workflow-core typecheck

      - name: 'Test Workflow Core'
        env:
          FASTGPT_TEST_SCOPE: workflow-core
        run: pnpm test

      - name: 'Build Workflow Core'
        run: pnpm --filter @fastgpt/workflow-core build

      - name: 'Upload Coverage (Workflow Core)'
        if: always() && hashFiles('packages/workflow-core/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-workflow-core
          path: packages/workflow-core/coverage/coverage-summary.json

  test-cli:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_cli == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck CLI'
        run: pnpm --filter @fastgpt/cli typecheck

      - name: 'Lint CLI'
        run: pnpm --filter @fastgpt/cli lint

      - name: 'Test CLI'
        env:
          FASTGPT_TEST_SCOPE: cli
        run: pnpm test

      - name: 'Verify CLI bin smoke'
        run: pnpm --filter @fastgpt/cli test:bin

      - name: 'Upload Coverage (CLI)'
        if: always() && hashFiles('cli/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cli
          path: cli/coverage/coverage-summary.json

  report-coverage:
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        test-global,
        test-dal,
        test-service,
        test-web,
        test-app,
        test-workflow-core,
        test-cli
      ]
    if: ${{ always() && needs.detect-changes.outputs.should_report == 'true' }}
    permissions:
      contents: read
      # Required to put a comment into the pull-request
      issues: write
      pull-requests: write
    steps:
      - name: 'Download Coverage Artifacts'
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: coverage-*

      - name: 'Report Coverage'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- fastgpt-coverage-report -->';
            const packages = [
              { name: 'Global', dir: 'coverage-global' },
              { name: 'DAL', dir: 'coverage-dal' },
              { name: 'Service', dir: 'coverage-service' },
              { name: 'Web', dir: 'coverage-web' },
              { name: 'App', dir: 'coverage-app' },
              { name: 'Workflow Core', dir: 'coverage-workflow-core' },
              { name: 'CLI', dir: 'coverage-cli' }
            ];

            const formatPct = (value) => {
              if (typeof value !== 'number') return 'N/A';
              return `${value.toFixed(2)}%`;
            };

            const rows = packages.map((pkg) => {
              const summaryPath = path.join(
                process.cwd(),
                'coverage-artifacts',
                pkg.dir,
                'coverage-summary.json'
              );

              if (!fs.existsSync(summaryPath)) {
                return `| ${pkg.name} | N/A | N/A | N/A | N/A |`;
              }

              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const total = summary.total || {};

              return [
                `| ${pkg.name}`,
                formatPct(total.statements?.pct),
                formatPct(total.branches?.pct),
                formatPct(total.functions?.pct),
                `${formatPct(total.lines?.pct)} |`
              ].join(' | ');
            });

            const body = [
              marker,
              '## Coverage Report',
              '',
              '| Package | Statements | Branches | Functions | Lines |',
              '| --- | ---: | ---: | ---: | ---: |',
              ...rows
            ].join('\n');

            await core.summary.addRaw(body).write();

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            try {
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100
              });
              const existing = comments.data.find((comment) =>
                comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body
                });
              }
            } catch (error) {
              core.warning(`Failed to publish coverage comment: ${error.message}`);
            }

      - name: 'Check Test Results'
        run: |
          if { [ "${{ needs.test-global.result }}" != "success" ] &&
               [ "${{ needs.test-global.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-dal.result }}" != "success" ] &&
               [ "${{ needs.test-dal.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-service.result }}" != "success" ] &&
               [ "${{ needs.test-service.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-web.result }}" != "success" ] &&
               [ "${{ needs.test-web.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-workflow-core.result }}" != "success" ] &&
               [ "${{ needs.test-workflow-core.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-cli.result }}" != "success" ] &&
               [ "${{ needs.test-cli.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-app.result }}" != "success" ] &&
               [ "${{ needs.test-app.result }}" != "skipped" ]; }; then
            exit 1
          fi
