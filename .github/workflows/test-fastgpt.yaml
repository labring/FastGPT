name: 'Test FastGPT'
on:
  pull_request:
    paths:
      - 'packages/global/**'
      - 'packages/service/**'
      - 'packages/web/**'
      - 'packages/workflow-core/**'
      - 'packages/workflow-cli/**'
      - 'projects/app/**'
      - 'projects/opensandbox-proxy/**'
      - 'projects/volume-manager/**'
      - 'sdk/**'
      - 'test/**'
      - 'scripts/test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'eslint.config.mjs'
      - '.npmrc'
      - '.github/workflows/test-fastgpt.yaml'
  workflow_dispatch:

    # Only one build per PR branch at a time
concurrency:
  group: 'test-fastgpt-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  # Required to checkout the code
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_global: ${{ steps.scope.outputs.run_global }}
      run_service: ${{ steps.scope.outputs.run_service }}
      run_web: ${{ steps.scope.outputs.run_web }}
      run_app: ${{ steps.scope.outputs.run_app }}
      run_opensandbox_proxy: ${{ steps.scope.outputs.run_opensandbox_proxy }}
      run_volume_manager: ${{ steps.scope.outputs.run_volume_manager }}
      run_workflow_core: ${{ steps.scope.outputs.run_workflow_core }}
      run_workflow_cli: ${{ steps.scope.outputs.run_workflow_cli }}
      should_report: ${{ steps.scope.outputs.should_report }}

    steps:
      - name: Detect affected test scopes
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const setOutputs = ({
              global,
              service,
              web,
              app,
              opensandboxProxy,
              volumeManager,
              workflowCore,
              workflowCli
            }) => {
              const shouldReport =
                global ||
                service ||
                web ||
                app ||
                opensandboxProxy ||
                volumeManager ||
                workflowCore ||
                workflowCli;
              core.setOutput('run_global', global ? 'true' : 'false');
              core.setOutput('run_service', service ? 'true' : 'false');
              core.setOutput('run_web', web ? 'true' : 'false');
              core.setOutput('run_app', app ? 'true' : 'false');
              core.setOutput('run_opensandbox_proxy', opensandboxProxy ? 'true' : 'false');
              core.setOutput('run_volume_manager', volumeManager ? 'true' : 'false');
              core.setOutput('run_workflow_core', workflowCore ? 'true' : 'false');
              core.setOutput('run_workflow_cli', workflowCli ? 'true' : 'false');
              core.setOutput('should_report', shouldReport ? 'true' : 'false');
              core.info(
                `Test scopes selected: global=${global}, service=${service}, web=${web}, app=${app}, opensandboxProxy=${opensandboxProxy}, volumeManager=${volumeManager}, workflowCore=${workflowCore}, workflowCli=${workflowCli}`
              );
            };

            if (context.eventName !== 'pull_request') {
              setOutputs({
                global: true,
                service: true,
                web: true,
                app: true,
                opensandboxProxy: true,
                volumeManager: true,
                workflowCore: true,
                workflowCli: true
              });
              return;
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const fileNames = changedFiles.map((file) => file.filename);
            const hasPath = (paths) => fileNames.some((fileName) =>
              paths.some((path) => fileName === path || fileName.startsWith(`${path}/`))
            );

            const affectsAll = hasPath([
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'turbo.json',
              'tsconfig.json',
              'vitest.config.mts',
              'eslint.config.mjs',
              '.npmrc',
              'test',
              'scripts/test',
              '.github/workflows/test-fastgpt.yaml'
            ]);

            const runGlobal = affectsAll || hasPath(['packages/global']);
            const runService = affectsAll || hasPath(['packages/global', 'packages/service', 'sdk']);
            const runWeb = affectsAll || hasPath(['packages/global', 'packages/web']);
            const runApp = affectsAll || hasPath([
              'packages/global',
              'packages/service',
              'packages/web',
              'packages/workflow-core',
              'projects/app',
              'sdk'
            ]);

            const runOpensandboxProxy =
              affectsAll || hasPath(['projects/opensandbox-proxy']);
            const runVolumeManager =
              affectsAll || hasPath(['packages/global', 'sdk', 'projects/volume-manager']);
            const runWorkflowCore = affectsAll || hasPath(['packages/global', 'packages/workflow-core']);
            const runWorkflowCli = affectsAll || hasPath([
              'packages/global',
              'packages/web',
              'packages/workflow-core',
              'packages/workflow-cli'
            ]);

            setOutputs({
              global: runGlobal,
              service: runService,
              web: runWeb,
              app: runApp,
              opensandboxProxy: runOpensandboxProxy,
              volumeManager: runVolumeManager,
              workflowCore: runWorkflowCore,
              workflowCli: runWorkflowCli
            });

  test-global:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_global == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Global'
        env:
          FASTGPT_TEST_SCOPE: global
        run: pnpm test

      - name: 'Upload Coverage (Global)'
        if: always() && hashFiles('packages/global/coverage/coverage-summary.json') !=
          ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-global
          path: |
            packages/global/coverage/coverage-final.json
            packages/global/coverage/coverage-summary.json

  test-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Service'
        env:
          FASTGPT_TEST_SCOPE: service
        run: pnpm test

      - name: 'Upload Coverage (Service)'
        if: always() && hashFiles('packages/service/coverage/coverage-summary.json') !=
          ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-service
          path: |
            packages/service/coverage/coverage-final.json
            packages/service/coverage/coverage-summary.json

  test-app:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test App'
        env:
          FASTGPT_TEST_SCOPE: app
        run: pnpm test

      - name: 'Upload Coverage (App)'
        if: always() && hashFiles('projects/app/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-app
          path: |
            projects/app/coverage/coverage-final.json
            projects/app/coverage/coverage-summary.json

  test-web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Test Web'
        env:
          FASTGPT_TEST_SCOPE: web
        run: pnpm test

      - name: 'Upload Coverage (Web)'
        if: always() && hashFiles('packages/web/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: |
            packages/web/coverage/coverage-final.json
            packages/web/coverage/coverage-summary.json

  test-workflow-core:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_workflow_core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck Workflow Core'
        run: pnpm --filter @fastgpt/workflow-core typecheck

      - name: 'Test Workflow Core'
        env:
          FASTGPT_TEST_SCOPE: workflow-core
        run: pnpm test

      - name: 'Build Workflow Core'
        run: pnpm --filter @fastgpt/workflow-core build

      - name: 'Upload Coverage (Workflow Core)'
        if: always() && hashFiles('packages/workflow-core/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-workflow-core
          path: packages/workflow-core/coverage/coverage-summary.json

  test-workflow-cli:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_workflow_cli == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck Workflow CLI'
        run: pnpm --filter @fastgpt/workflow-cli typecheck

      - name: 'Test Workflow CLI'
        env:
          FASTGPT_TEST_SCOPE: workflow-cli
        run: pnpm test

      - name: 'Verify CLI bin and packed package'
        run: pnpm --filter @fastgpt/workflow-cli test:package

      - name: 'Upload Coverage (Workflow CLI)'
        if: always() && hashFiles('packages/workflow-cli/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-workflow-cli
          path: packages/workflow-cli/coverage/coverage-summary.json

  test-volume-manager:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_volume_manager == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck Volume Manager'
        run: pnpm --filter @fastgpt/volume-manager typecheck

      - name: 'Test Volume Manager'
        env:
          FASTGPT_TEST_SCOPE: volume-manager
        run: pnpm test

      - name: 'Build Volume Manager'
        run: pnpm --filter @fastgpt/volume-manager build

      - name: 'Upload Coverage (Volume Manager)'
        if: always() && hashFiles('projects/volume-manager/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-volume-manager
          path: |
            projects/volume-manager/coverage/coverage-final.json
            projects/volume-manager/coverage/coverage-summary.json

  test-opensandbox-proxy:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_opensandbox_proxy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 'Install Deps'
        run: pnpm install --frozen-lockfile

      - name: 'Typecheck OpenSandbox Proxy'
        run: pnpm --dir projects/opensandbox-proxy exec tsc --noEmit

      - name: 'Test OpenSandbox Proxy'
        run: pnpm --dir projects/opensandbox-proxy test

  report-coverage:
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        test-global,
        test-service,
        test-web,
        test-app,
        test-opensandbox-proxy,
        test-volume-manager,
        test-workflow-core,
        test-workflow-cli
      ]
    if: ${{ always() && needs.detect-changes.outputs.should_report == 'true' }}
    permissions:
      contents: read
      # Required to put a comment into the pull-request
      issues: write
      pull-requests: write
    steps:
      - name: 'Download Coverage Artifacts'
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: coverage-*

      - name: 'Report Coverage'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- fastgpt-coverage-report -->';
            const packages = [
              { name: 'Global', dir: 'coverage-global' },
              { name: 'Service', dir: 'coverage-service' },
              { name: 'Web', dir: 'coverage-web' },
              { name: 'App', dir: 'coverage-app' },
              { name: 'Volume Manager', dir: 'coverage-volume-manager' },
              { name: 'Workflow Core', dir: 'coverage-workflow-core' },
              { name: 'Workflow CLI', dir: 'coverage-workflow-cli' }
            ];

            const formatPct = (value) => {
              if (typeof value !== 'number') return 'N/A';
              return `${value.toFixed(2)}%`;
            };

            const rows = packages.map((pkg) => {
              const summaryPath = path.join(
                process.cwd(),
                'coverage-artifacts',
                pkg.dir,
                'coverage-summary.json'
              );

              if (!fs.existsSync(summaryPath)) {
                return `| ${pkg.name} | N/A | N/A | N/A | N/A |`;
              }

              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const total = summary.total || {};

              return [
                `| ${pkg.name}`,
                formatPct(total.statements?.pct),
                formatPct(total.branches?.pct),
                formatPct(total.functions?.pct),
                `${formatPct(total.lines?.pct)} |`
              ].join(' | ');
            });

            const body = [
              marker,
              '## Coverage Report',
              '',
              '| Package | Statements | Branches | Functions | Lines |',
              '| --- | ---: | ---: | ---: | ---: |',
              ...rows
            ].join('\n');

            await core.summary.addRaw(body).write();

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            try {
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100
              });
              const existing = comments.data.find((comment) =>
                comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body
                });
              }
            } catch (error) {
              core.warning(`Failed to publish coverage comment: ${error.message}`);
            }

      - name: 'Check Test Results'
        run: |
          if { [ "${{ needs.test-global.result }}" != "success" ] &&
               [ "${{ needs.test-global.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-service.result }}" != "success" ] &&
               [ "${{ needs.test-service.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-web.result }}" != "success" ] &&
               [ "${{ needs.test-web.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-workflow-core.result }}" != "success" ] &&
               [ "${{ needs.test-workflow-core.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-workflow-cli.result }}" != "success" ] &&
               [ "${{ needs.test-workflow-cli.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-opensandbox-proxy.result }}" != "success" ] &&
               [ "${{ needs.test-opensandbox-proxy.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-volume-manager.result }}" != "success" ] &&
               [ "${{ needs.test-volume-manager.result }}" != "skipped" ]; } ||
             { [ "${{ needs.test-app.result }}" != "success" ] &&
               [ "${{ needs.test-app.result }}" != "skipped" ]; }; then
            exit 1
          fi
