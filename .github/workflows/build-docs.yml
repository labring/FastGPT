name: Release FastGPT-Document
on:
  push:
    branches:
      - main
    paths:
      - 'document/**'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  pull-requests: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: labring/fastgpt-img
          token: ${{ secrets.DOCS_IMGS_SYNC_TOKEN }}
          path: fastgpt-img

      - name: Sync images
        run: |
          # Create imgs directory if it doesn't exist
          mkdir -p fastgpt-img

          # Copy all images from document/public/imgs to the target repository
          cp -r document/public/imgs/* fastgpt-img

          # Navigate to target repository
          cd fastgpt-img

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add, commit and push changes
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync images from FastGPT document at $(date)"
            git push
            echo "Images synced successfully"
          else
            echo "No changes to sync"
          fi
  # Add a new job to generate unified timestamp
  generate-timestamp:
    needs: sync-images
    runs-on: ubuntu-latest
    outputs:
      datetime: ${{ steps.datetime.outputs.datetime }}
    steps:
      - name: Get current datetime
        id: datetime
        run: echo "datetime=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

  build-images:
    needs: generate-timestamp
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        domain_config:
          - domain: 'https://fastgpt.io'
            suffix: 'io'
          - domain: 'https://fastgpt.cn'
            suffix: 'cn'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker workspace catalog
        run: cp pnpm-workspace.yaml document/pnpm-workspace.yaml

      - name: Rewrite image paths
        if: matrix.domain_config.suffix == 'io'
        run: |
          set -euo pipefail
          find document/content -name "*.mdx" -type f | while read -r file; do
            sed -i 's|](/imgs/|](https://cdn.jsdelivr.net/gh/labring/fastgpt-img@main/|g' "$file"
          done
      - name: Rewrite domain links for CN
        if: matrix.domain_config.suffix == 'cn'
        run: |
          set -euo pipefail
          find document/content -name "*.mdx" -type f | while read -r file; do
            sed -i 's|doc\.fastgpt\.io|doc.fastgpt.cn|g' "$file"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository_owner }}/fastgpt-docs
          tags: |
            ${{ matrix.domain_config.suffix }}-${{ needs.generate-timestamp.outputs.datetime }}
          flavor: latest=false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images (CN)
        if: matrix.domain_config.suffix == 'cn'
        uses: docker/build-push-action@v6
        with:
          context: ./document
          file: ./document/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FASTGPT_HOME_DOMAIN=${{ matrix.domain_config.domain }}
            DOC_TRACK_SRC=${{ secrets.DOC_TRACK_SRC }}
            DOC_TRACK_SITE_ID=${{ secrets.DOC_TRACK_CN }}

      - name: Build and push Docker images (IO)
        if: matrix.domain_config.suffix == 'io'
        uses: docker/build-push-action@v6
        with:
          context: ./document
          file: ./document/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FASTGPT_HOME_DOMAIN=${{ matrix.domain_config.domain }}
            DOC_TRACK_SRC=${{ secrets.DOC_TRACK_SRC }}
            DOC_TRACK_SITE_ID=${{ secrets.DOC_TRACK_IO }}

  update-images:
    needs: [generate-timestamp, build-images]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        domain_config:
          - domain: 'https://fastgpt.io'
            suffix: 'io'
            deployment: 'fastgpt-docs'
            kube_config: 'KUBE_CONFIG_IO'
          - domain: 'https://fastgpt.cn'
            suffix: 'cn'
            deployment: 'fastgpt-docs'
            kube_config: 'KUBE_CONFIG_CN'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Add kubeconfig setup step to handle encoding issues
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets[matrix.domain_config.kube_config] }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update deployment image
        env:
          DOMAIN_SUFFIX: ${{ matrix.domain_config.suffix }}
          IMAGE_TAG: ${{ needs.generate-timestamp.outputs.datetime }}
          GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: |
          IMAGE="${GHCR_IMAGE_PREFIX}/fastgpt-docs:${DOMAIN_SUFFIX}-${IMAGE_TAG}"
          kubectl set image deployment/${{ matrix.domain_config.deployment }} ${{ matrix.domain_config.deployment }}="$IMAGE"

      - name: Annotate deployment
        env:
          DOMAIN_SUFFIX: ${{ matrix.domain_config.suffix }}
          IMAGE_TAG: ${{ needs.generate-timestamp.outputs.datetime }}
          GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: |
          IMAGE="${GHCR_IMAGE_PREFIX}/fastgpt-docs:${DOMAIN_SUFFIX}-${IMAGE_TAG}"
          kubectl annotate deployment/${{ matrix.domain_config.deployment }} originImageName="$IMAGE" --overwrite
