name: Preview Docs Image — Push

on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ['Preview Docs Image — Build']
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    outputs:
      should_publish: ${{ steps.prepare.outputs.should_publish }}
      number: ${{ steps.prepare.outputs.number }}
      sha: ${{ steps.prepare.outputs.sha }}
      run_id: ${{ steps.prepare.outputs.run_id }}
      manual: ${{ steps.prepare.outputs.manual }}

    steps:
      - name: Resolve preview build and publish permission
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const manualMarker = '<!-- fastgpt-doc-preview-manual -->';

            const hasPublishPermission = async (username) => {
              if (!username) return false;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username
                });
                return ['admin', 'maintain', 'write', 'read'].includes(data.permission);
              } catch (error) {
                core.warning(`Unable to resolve repository permission for ${username}: ${error.message}`);
                return false;
              }
            };

            const setDefaultOutputs = () => {
              core.setOutput('should_publish', 'false');
              core.setOutput('manual', 'false');
            };

            const upsertComment = async (issueNumber, body) => {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const existingComment = comments.find((comment) => comment.body.includes(manualMarker));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                });
              }
            };

            const findBuildRun = async (sha) => {
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'preview-docs-build.yml',
                event: 'pull_request',
                status: 'completed',
                per_page: 100
              });
              return workflowRuns.find((run) =>
                run.head_sha === sha && run.conclusion === 'success'
              );
            };

            const hasArtifact = async (runId) => {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100
              });
              return artifacts.some((artifact) => artifact.name === 'preview-docs-image');
            };

            setDefaultOutputs();

            let prNumber;
            let sha;
            let runId;
            let manual = false;

            if (context.eventName === 'workflow_run') {
              const workflowRun = context.payload.workflow_run;
              if (workflowRun.conclusion !== 'success') {
                core.info(`Build workflow concluded with ${workflowRun.conclusion}; skipping docs preview publish.`);
                return;
              }

              runId = workflowRun.id;
              sha = workflowRun.head_sha;
              prNumber = workflowRun.pull_requests?.[0]?.number;

              if (!prNumber) {
                const headOwner = workflowRun.head_repository?.owner?.login;
                const headBranch = workflowRun.head_branch;
                if (headOwner && headBranch) {
                  const { data: pullRequests } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    head: `${headOwner}:${headBranch}`
                  });
                  const matchedPullRequest = pullRequests.find((pullRequest) => pullRequest.head.sha === sha) ?? pullRequests[0];
                  prNumber = matchedPullRequest?.number;
                }
              }

              if (!prNumber) {
                core.warning('No pull request was found for the completed docs preview build.');
                return;
              }

              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              if (pullRequest.state !== 'open' || pullRequest.head.sha !== sha) {
                core.info(`Skipping stale docs preview build ${sha}; the current PR head is ${pullRequest.head.sha}.`);
                return;
              }
              if (!await hasPublishPermission(pullRequest.user.login)) {
                await upsertComment(prNumber, `${manualMarker}
            ✅ Docs preview image built successfully for \`${sha}\`.

            Automatic publishing is disabled for this PR. A maintainer can comment:

            \`/preview push\`

            to publish the image from this exact build.`);
                core.warning(`PR #${prNumber} author association is ${pullRequest.author_association}; waiting for a maintainer comment before publishing.`);
                return;
              }
            } else if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue;
              const comment = context.payload.comment;
              if (!issue.pull_request || comment.body.trim() !== '/preview push') {
                return;
              }

              if (!await hasPublishPermission(comment.user.login)) {
                core.warning(`Comment author ${comment.user.login} does not have repository publish permission.`);
                return;
              }

              prNumber = issue.number;
              manual = true;
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              if (pullRequest.state !== 'open') {
                core.info(`Skipping closed pull request #${prNumber}.`);
                return;
              }
              sha = pullRequest.head.sha;
              const buildRun = await findBuildRun(sha);

              if (!buildRun) {
                await upsertComment(prNumber, `${manualMarker}
            ⚠️ No successful docs preview build was found for the current PR commit \`${sha}\`. Please wait for the build workflow to finish, then comment \`/preview push\` again.`);
                return;
              }
              runId = buildRun.id;
            } else {
              return;
            }

            if (!await hasArtifact(runId)) {
              core.warning(`No docs preview artifact was found for workflow run ${runId}.`);
              return;
            }

            core.setOutput('should_publish', 'true');
            core.setOutput('number', String(prNumber));
            core.setOutput('sha', sha);
            core.setOutput('run_id', String(runId));
            core.setOutput('manual', manual ? 'true' : 'false');

  push:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: 'preview-docs-deploy-${{ needs.prepare.outputs.number }}'
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-docs-image
          path: /tmp
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Docker image
        run: docker load --input /tmp/docs-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          SHA="${{ needs.prepare.outputs.sha }}"
          docker tag fastgpt-docs-pr:${SHA} \
            ghcr.io/${{ github.repository_owner }}/fastgpt-docs-pr:${SHA}
          docker push ghcr.io/${{ github.repository_owner }}/fastgpt-docs-pr:${SHA}

      - name: Deploy isolated docs preview
        id: deploy
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_CN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/fastgpt-docs-pr:${{ needs.prepare.outputs.sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
        run: |
          set -euo pipefail

          BASE_NAME="fastgpt-doc-preview"
          RESOURCE_NAME="${BASE_NAME}-pr-${PR_NUMBER}"
          PREVIEW_HOST="${RESOURCE_NAME}.sealoshzh.site"
          WORK_DIR=$(mktemp -d)
          KUBECONFIG_FILE=$(mktemp)
          trap 'rm -rf "$WORK_DIR"; rm -f "$KUBECONFIG_FILE"' EXIT
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          export KUBECONFIG="$KUBECONFIG_FILE"

          # Clone the trusted preview workload so cluster-specific pod and ingress
          # settings stay centralized in the existing base resources.
          kubectl get deployment "$BASE_NAME" -o json > "$WORK_DIR/base-deployment.json"
          if kubectl get service "$BASE_NAME" -o json > "$WORK_DIR/base-service.json" 2>/dev/null; then
            BASE_SERVICE="$BASE_NAME"
          else
            BASE_LABELS=$(jq -c '.spec.template.metadata.labels // {}' "$WORK_DIR/base-deployment.json")
            BASE_SERVICE=$(
              kubectl get services -o json |
                jq -r --argjson labels "$BASE_LABELS" '
                  [
                    .items[]
                    | select(.spec.selector != null)
                    | select((.spec.selector | to_entries | all(. as $entry | $labels[$entry.key] == $entry.value)))
                    | .metadata.name
                  ]
                  | first // empty
                '
            )
            if [[ -z "$BASE_SERVICE" ]]; then
              echo "::error::Unable to find the base docs preview Service." >&2
              exit 1
            fi
            kubectl get service "$BASE_SERVICE" -o json > "$WORK_DIR/base-service.json"
          fi

          BASE_INGRESS=$(
            kubectl get ingress -o json |
              jq -r --arg service "$BASE_SERVICE" '
                [
                  .items[]
                  | select(
                      .spec.defaultBackend.service.name? == $service
                      or any(.spec.rules[]?.http.paths[]?; .backend.service.name == $service)
                    )
                  | .metadata.name
                ]
                | first // empty
              '
          )
          if [[ -z "$BASE_INGRESS" ]]; then
            echo "::error::Unable to find the base docs preview Ingress." >&2
            exit 1
          fi
          kubectl get ingress "$BASE_INGRESS" -o json > "$WORK_DIR/base-ingress.json"

          # Give every selected label a PR-specific value so the base Service cannot
          # route traffic to an isolated PR workload.
          SELECTOR=$(
            jq -cn \
              --argjson deployment "$(jq -c '.spec.selector.matchLabels // {}' "$WORK_DIR/base-deployment.json")" \
              --argjson service "$(jq -c '.spec.selector // {}' "$WORK_DIR/base-service.json")" \
              --arg value "pr-${PR_NUMBER}" \
              --arg pr "$PR_NUMBER" \
              '$deployment + $service | with_entries(.value = $value) + {"fastgpt.io/preview-pr": $pr}'
          )

          jq \
            --arg name "$RESOURCE_NAME" \
            --arg image "$IMAGE" \
            --arg pr "$PR_NUMBER" \
            --argjson selector "$SELECTOR" '
              .metadata.name = $name
              | del(
                  .metadata.creationTimestamp,
                  .metadata.generation,
                  .metadata.managedFields,
                  .metadata.ownerReferences,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .status
                )
              | .metadata.labels = ((.metadata.labels // {}) + {
                  "fastgpt.io/preview-pr": $pr
                })
              | .metadata.annotations = ((.metadata.annotations // {}) + {
                  "fastgpt.io/preview-pr": $pr,
                  "originImageName": $image
                })
              | del(
                  .metadata.annotations["deployment.kubernetes.io/revision"],
                  .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]
                )
              | .spec.replicas = 1
              | .spec.selector.matchLabels = $selector
              | .spec.template.metadata.labels = ((.spec.template.metadata.labels // {}) + $selector)
              | .spec.template.metadata.annotations = ((.spec.template.metadata.annotations // {}) + {
                  "fastgpt.io/preview-pr": $pr
                })
              | .spec.template.spec.containers[0].image = $image
            ' "$WORK_DIR/base-deployment.json" > "$WORK_DIR/deployment.json"

          jq \
            --arg name "$RESOURCE_NAME" \
            --arg pr "$PR_NUMBER" \
            --argjson selector "$SELECTOR" '
              .metadata.name = $name
              | del(
                  .metadata.creationTimestamp,
                  .metadata.generation,
                  .metadata.managedFields,
                  .metadata.ownerReferences,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .spec.clusterIP,
                  .spec.clusterIPs,
                  .spec.healthCheckNodePort,
                  .spec.ipFamilies,
                  .spec.ipFamilyPolicy,
                  .status
                )
              | .metadata.labels = ((.metadata.labels // {}) + {
                  "fastgpt.io/preview-pr": $pr
                })
              | .metadata.annotations = ((.metadata.annotations // {}) + {
                  "fastgpt.io/preview-pr": $pr
                })
              | del(
                  .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"],
                  .spec.allocateLoadBalancerNodePorts,
                  .spec.externalTrafficPolicy,
                  .spec.loadBalancerClass,
                  .spec.loadBalancerIP,
                  .spec.loadBalancerSourceRanges
                )
              | .spec.type = "ClusterIP"
              | .spec.selector = $selector
              | .spec.ports |= map(del(.nodePort))
            ' "$WORK_DIR/base-service.json" > "$WORK_DIR/service.json"

          jq \
            --arg name "$RESOURCE_NAME" \
            --arg host "$PREVIEW_HOST" \
            --arg service "$RESOURCE_NAME" \
            --arg pr "$PR_NUMBER" '
              .metadata.name = $name
              | del(
                  .metadata.creationTimestamp,
                  .metadata.generation,
                  .metadata.managedFields,
                  .metadata.ownerReferences,
                  .metadata.resourceVersion,
                  .metadata.uid,
                  .status
                )
              | .metadata.labels = ((.metadata.labels // {}) + {
                  "fastgpt.io/preview-pr": $pr
                })
              | .metadata.annotations = ((.metadata.annotations // {}) + {
                  "fastgpt.io/preview-pr": $pr
                })
              | del(.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])
              | if .metadata.annotations["external-dns.alpha.kubernetes.io/hostname"]? != null
                then .metadata.annotations["external-dns.alpha.kubernetes.io/hostname"] = $host
                else . end
              | .spec.rules = ((.spec.rules // []) | map(
                  .host = $host
                  | if .http != null
                    then .http.paths |= map(
                      if .backend.service != null
                      then .backend.service.name = $service
                      else . end
                    )
                    else . end
                ))
              | if .spec.defaultBackend.service.name? != null
                then .spec.defaultBackend.service.name = $service
                else . end
              | if (.spec.tls // [] | length) > 0
                then .spec.tls |= map(.hosts = [$host])
                else . end
            ' "$WORK_DIR/base-ingress.json" > "$WORK_DIR/ingress.json"

          kubectl apply \
            -f "$WORK_DIR/deployment.json" \
            -f "$WORK_DIR/service.json" \
            -f "$WORK_DIR/ingress.json"

          kubectl rollout status "deployment/$RESOURCE_NAME" --timeout=180s
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            --retry-all-errors \
            -o /dev/null "https://$PREVIEW_HOST"

          echo "preview_url=https://$PREVIEW_HOST" >> "$GITHUB_OUTPUT"

      - name: Format preview timestamp
        id: preview_time
        run: |
          echo "value=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S (UTC+8)')" >> "$GITHUB_OUTPUT"

      - name: Add PR comment on success
        if: success() && needs.prepare.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.prepare.outputs.number }}');
            const marker = '<!-- fastgpt-doc-preview -->';
            const mode = '${{ needs.prepare.outputs.manual }}' === 'true' ? 'Manual publish successful' : 'Docs preview deployed';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existingComment = comments.find((comment) => comment.body.includes(marker));
            const commentBody = `${marker}
            ✅ **${mode}**

            🔗 [👀 Click here to visit preview](${{ steps.deploy.outputs.preview_url }})

            \`\`\`
            ghcr.io/${{ github.repository_owner }}/fastgpt-docs-pr:${{ needs.prepare.outputs.sha }}
            \`\`\`

            🕒 Time: ${{ steps.preview_time.outputs.value }}`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

  cleanup:
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: 'preview-docs-deploy-${{ github.event.pull_request.number }}'
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Remove isolated docs preview
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_CN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          KUBECONFIG_FILE=$(mktemp)
          trap 'rm -f "$KUBECONFIG_FILE"' EXIT
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"

          kubectl --kubeconfig "$KUBECONFIG_FILE" delete \
            deployment,service,ingress \
            -l "fastgpt.io/preview-pr=$PR_NUMBER" \
            --ignore-not-found \
            --wait=false
