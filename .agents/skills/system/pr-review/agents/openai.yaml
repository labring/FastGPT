interface:
  display_name: 'PR Review'
  short_description: '结合产品需求审查功能、底层设计收敛性、重复冗余、可维护性与规范'
  default_prompt: 'Use $pr-review to review this PR in a worktree, including pro, anchored on product requirements and real boundaries while checking correctness, root-cause design convergence (no band-aid patches), duplication, redundancy, maintainability, and repository rules; report findings without posting comments.'

policy:
  allow_implicit_invocation: false
