interface:
  display_name: 'PR Review'
  short_description: '需求明确的 PR 基于最新 upstream main 审查，复审拒绝补丁式修复'
  default_prompt: 'Use $pr-review to review this PR URL: reject it if the requirement is unclear, otherwise review it in a worktree based on the latest upstream main (including pro) within the stated requirement scope; report findings without posting comments.'

policy:
  allow_implicit_invocation: false
