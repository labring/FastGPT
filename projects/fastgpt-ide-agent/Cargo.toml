[package]
name = "fastgpt-ide-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs", "io-util", "signal", "process"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", features = ["io-util"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
pty-process = { version = "0.5.4", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
futures-util = "0.3.34"
ignore = "0.4.33"
cap-std = "4.0.3"
notify-debouncer-full = { version = "0.8.0", features = ["tokio"] }
sha2 = "0.11.1"
subtle = "2.6.1"
mime-infer = { version = "4.1.0", default-features = false }
tar = "0.4.46"
zstd = "0.14.4"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
