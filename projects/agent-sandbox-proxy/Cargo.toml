[package]
name = "fastgpt-agent-sandbox-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "ws", "tracing"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dotenv-ng = "1.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
url = "2.5.8"
